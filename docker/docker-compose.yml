version: "3.9"

services:
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=none
    volumes:
      - neo4j-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports: ["9200:9200"]
    volumes:
      - es-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "src.app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      - elasticsearch
      - neo4j
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "src.app.gradio_ui"]
    ports: ["7860:7860"]
    depends_on:
      - api

volumes:
  neo4j-data:
  es-data:

